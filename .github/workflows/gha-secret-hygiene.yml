name: GHA Secret Hygiene

# Static scan for public-repo Actions secret-exposure patterns.
# Daily schedule skips when no main merges / workflow touches landed in the
# lookback window. Always runs on PRs that touch workflows or the scanner.
# See docs/ops/gha-secret-hygiene.md.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when no PRs merged / workflows changed recently"
        type: boolean
        default: false
      lookback_hours:
        description: "Hours to look back for merged PRs / workflow commits"
        type: string
        default: "36"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/gha_secret_hygiene.py"
      - "scripts/gha_secret_hygiene_cli.py"
      - "scripts/test_gha_secret_hygiene.py"
      - "docs/ops/gha-secret-hygiene.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/gha_secret_hygiene.py"
      - "scripts/gha_secret_hygiene_cli.py"
      - "scripts/test_gha_secret_hygiene.py"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: gha-secret-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Always run on PR / push / forced dispatch
        id: always
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          EVENT="$EVENT_NAME"
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=event_${EVENT}_or_force" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=needs_schedule_gate" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.always.outputs.should_run != 'true'

      - uses: actions/setup-python@v5
        if: steps.always.outputs.should_run != 'true'
        with:
          python-version: "3.12"

      - name: Schedule gate (merged PRs / workflow touches)
        id: schedule
        if: steps.always.outputs.should_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK: ${{ github.event.inputs.lookback_hours || '36' }}
        run: |
          set -euo pipefail
          python3 scripts/gha_secret_hygiene_cli.py schedule-gate \
            --lookback-hours "$LOOKBACK" \
            --github-output \
            --json | tee /tmp/gha_hygiene_gate.json

      - name: Decide
        id: decide
        env:
          ALWAYS_SHOULD_RUN: ${{ steps.always.outputs.should_run }}
          ALWAYS_REASON: ${{ steps.always.outputs.reason }}
          SCHEDULE_SHOULD_RUN: ${{ steps.schedule.outputs.should_run }}
          SCHEDULE_REASON: ${{ steps.schedule.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "${ALWAYS_SHOULD_RUN:-}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=${ALWAYS_REASON}" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=${SCHEDULE_SHOULD_RUN}" >> "$GITHUB_OUTPUT"
            echo "reason=${SCHEDULE_REASON}" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan workflows
        run: |
          set -euo pipefail
          echo "Gate reason: ${{ needs.gate.outputs.reason }}"
          python3 scripts/gha_secret_hygiene_cli.py check --json | tee /tmp/gha_hygiene_report.json
          python3 scripts/gha_secret_hygiene_cli.py check

      - name: Pytest hygiene suite
        run: python3 scripts/test_gha_secret_hygiene.py

  skip_note:
    needs: gate
    if: needs.gate.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Skipping GHA secret hygiene — ${{ needs.gate.outputs.reason }}"
          echo "No merged PRs / workflow touches in lookback (or gate deferred)."
