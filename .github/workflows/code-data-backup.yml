name: Weekly code and data backup

# Sunday snapshot of application code + harvested datasets.
# Always stores a GitHub Actions artifact (90-day retention).
# Uploads to S3 when the same secrets as Value Investor are present:
#   BACKUP_S3_URI, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
# Objects land under {BACKUP_S3_URI}/school-compass/ so they do not mix
# with FTSE snapshots.
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if backup already succeeded today"
        type: boolean
        default: false
      include_git:
        description: "Embed a full git bundle in the archive"
        type: boolean
        default: true
      upload_s3:
        description: "Upload to BACKUP_S3_URI when configured"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: school-compass-code-data-backup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip if backup already ran today
        id: gate
        uses: actions/github-script@v7
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'code-data-backup.yml';
            const runId = context.runId;
            const dayStart = new Date(Date.UTC(
              new Date().getUTCFullYear(),
              new Date().getUTCMonth(),
              new Date().getUTCDate(),
            )).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 20,
            });
            const prior = (data.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const succeeded = prior.find((r) => r.conclusion === 'success');
            if (succeeded) {
              core.info(`Skipping — backup already succeeded today (run ${succeeded.id})`);
              core.setOutput('should_run', 'false');
              return;
            }
            core.setOutput('should_run', 'true');

  backup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create code + data snapshot
        id: snap
        run: |
          set -euo pipefail
          ARGS=(snapshot --json)
          INCLUDE_GIT="${{ github.event.inputs.include_git }}"
          if [ "${INCLUDE_GIT:-true}" != "false" ]; then
            ARGS+=(--include-git)
          fi
          python3 scripts/code_data_backup.py "${ARGS[@]}" > /tmp/backup.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("/tmp/backup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(f"archive_path={data['archive_path']}\n")
              handle.write(f"manifest_path={data['manifest_path']}\n")
          PY

      - name: Verify snapshot checksum
        run: python3 scripts/code_data_backup.py verify "$(python3 -c 'import json; print(json.load(open("/tmp/backup.json"))["archive_path"])')"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-compass-code-data-backup
          path: |
            output/backups/school-compass-*.tar.gz
            output/backups/school-compass-*.manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Optional S3 upload
        if: ${{ github.event_name != 'workflow_dispatch' || format('{0}', github.event.inputs.upload_s3) != 'false' }}
        continue-on-error: true
        env:
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -euo pipefail
          python3 scripts/code_data_backup.py deliver --from-json /tmp/backup.json --upload --upload-monthly --json

      - name: Backup delivery summary
        if: always()
        run: |
          if [ ! -f /tmp/backup.json ]; then
            echo "No backup.json — snapshot step did not complete"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/backup.json").read_text())
          upload = payload.get("upload") or {}
          upload_monthly = payload.get("upload_monthly") or {}
          manifest = payload.get("manifest") or {}
          print(
              f"Snapshot ok: {manifest.get('archive_name')} "
              f"({manifest.get('bytes', 0):,} bytes, {manifest.get('file_count', 0)} files, "
              f"kind={manifest.get('kind')})"
          )
          if manifest.get("git_head"):
              print(f"Git HEAD: {manifest.get('git_head')}")
          if upload.get("uploaded"):
              print(f"S3 upload ok: {upload.get('archive_dest')}")
          elif upload:
              detail = upload.get("reason") or upload.get("error") or "not requested"
              print(f"S3 upload skipped/failed: {detail}")
          else:
              print("S3 upload not attempted")
          if upload_monthly.get("uploaded"):
              print(
                  f"S3 monthly pin ok: {upload_monthly.get('archive_dest')} "
                  f"(month {upload_monthly.get('month_key')})"
              )
          elif upload_monthly:
              detail = upload_monthly.get("reason") or upload_monthly.get("error") or "not requested"
              print(f"S3 monthly pin skipped/failed: {detail}")
          PY
