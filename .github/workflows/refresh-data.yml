name: Refresh school data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 15 * *"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest Hampshire maintained set (age climb)
        run: |
          # Economic path: maintain Hampshire EY→KS1→KS2→secondary depth.
          # Full national scaffold remains available via `npm run harvest`.
          python3 scripts/harvest-schools.py --seed-la
          python3 scripts/enrich-geocode.py
          python3 scripts/enrich-secondaries.py --seed-la
          python3 scripts/enrich-independents.py
          python3 scripts/enrich-phonics.py --seed-la
          python3 scripts/harvest-ey-providers.py
          python3 scripts/harvest-childminders.py
          python3 scripts/enrich-ey-schools.py
          python3 scripts/extract-ks2-history.py --seed-la
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/schools-index.json public/data/schools-directory.json public/data/harvest-summary.json src/data/harvest-summary.json public/data/ks2-history public/data/ey-providers-index.json public/data/childminders-index.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Hampshire maintained school index"
            git push
          fi
