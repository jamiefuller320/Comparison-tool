name: Refresh school data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 15 * *"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest national KS2 index
        run: |
          python3 scripts/harvest-schools.py
          python3 scripts/enrich-geocode.py
          python3 scripts/enrich-secondaries.py
          python3 scripts/enrich-independents.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/schools-index.json public/data/schools-directory.json public/data/harvest-summary.json src/data/harvest-summary.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh harvested school performance index"
            git push
          fi
