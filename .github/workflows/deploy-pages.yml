name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot loops push with GITHUB_TOKEN, which does not fire branch push workflows.
  # Redeploy main after a successful loop run on main (same repo only).
  workflow_run:
    workflows:
      - Build on-demand LA pack
      - Force school data refresh
      - GIAS lifecycle sync
      - Human-gated review digest
      - Pack quality loop
      - Process product feedback
      - Qualitative capture loop
      - Qualitative quality loop
      - Qualitative source spot-check loop
      - Refresh Hampshire early years
      - Refresh school data
      - SEO coverage loop
    types: [completed]
    branches: [main]
  schedule:
    # Safety net if a loop run is skipped or workflow_run misfires.
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One live Pages deploy at a time. cancel-in-progress drops older runs so a
# stale manual dispatch cannot overwrite a newer main push mid-flight.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    # Manual runs must target main; never publish an old feature-branch checkout.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy tip
        uses: actions/checkout@v4
        with:
          # Push events deploy the exact SHA that triggered the run.
          # Other triggers always rebuild the tip of main (loop pushes do not
          # set github.sha to the new commit on workflow_run).
          ref: >-
            ${{
              (github.event_name == 'workflow_dispatch' ||
               github.event_name == 'workflow_run' ||
               github.event_name == 'schedule') && 'main' || github.sha
            }}
      - name: Confirm deploy commit
        run: |
          echo "Deploying $(git rev-parse --short HEAD) from $(git rev-parse --abbrev-ref HEAD || echo detached)"
          git log -1 --oneline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          # Apex custom domain (public/CNAME → schoolcompass.uk). Leave
          # GITHUB_PAGES_PROJECT_PATH unset so assets are rooted at /, not
          # /Comparison-tool/.
          GITHUB_PAGES: "true"
          # Do not pass a GitHub token into this build. Missing-school,
          # area-coverage, data-challenge, and product feedback use the
          # Supabase anon insert (NEXT_PUBLIC_SUPABASE_* below). A
          # NEXT_PUBLIC_* dispatch token would ship in the public JS bundle.
          # Optional Supabase magic-link accounts (Save shortlist across devices).
          # Without these, Save shortlist still works as a browser-local email save.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional Google Search Console HTML-tag verification token.
          # Domain property (sc-domain:schoolcompass.uk) uses DNS and needs no
          # meta tag; set this only if you also verify a URL-prefix property.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
