name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live Pages deploy at a time. cancel-in-progress drops older runs so a
# stale manual dispatch cannot overwrite a newer main push mid-flight.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    # Manual runs must target main; never publish an old feature-branch checkout.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy tip
        uses: actions/checkout@v4
        with:
          # Push events deploy the exact SHA that triggered the run.
          # workflow_dispatch always rebuilds the tip of main, even if the
          # Actions UI was opened from another branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
      - name: Confirm deploy commit
        run: |
          echo "Deploying $(git rev-parse --short HEAD) from $(git rev-parse --abbrev-ref HEAD || echo detached)"
          git log -1 --oneline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          # Optional fine-grained PAT (Actions: write) so "A school is missing"
          # can queue repository_dispatch. Workflow still enforces 1 refresh/day.
          NEXT_PUBLIC_MISSING_SCHOOL_DISPATCH_TOKEN: ${{ secrets.MISSING_SCHOOL_DISPATCH_TOKEN }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
