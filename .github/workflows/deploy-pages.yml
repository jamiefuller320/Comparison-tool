name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          # Optional fine-grained PAT (Actions: write) so "A school is missing"
          # can queue repository_dispatch. Workflow still enforces 1 refresh/day.
          NEXT_PUBLIC_MISSING_SCHOOL_DISPATCH_TOKEN: ${{ secrets.MISSING_SCHOOL_DISPATCH_TOKEN }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
