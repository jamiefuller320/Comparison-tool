name: Qualitative capture loop

# Coverage-first, min-cost quality:
# - Weekly: wide free website capture + deterministic narratives (no Cursor spend)
# - Stale re-screens: ETag / Last-Modified / content-hash; reuse unchanged pages
# - Manual dispatch: optional Cursor/auto polish on rich schools only
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max new schools to capture this run (free crawl)
        required: false
        default: "50"
      refresh_stale_days:
        description: Re-screen captures older than N days (0 = off)
        required: false
        default: "28"
      refresh_limit:
        description: Max stale schools to change-detect this run
        required: false
        default: "15"
      synthesize_provider:
        description: Narrative provider — prefer none for coverage; cursor/auto for paid polish
        required: false
        default: "none"
      synthesize_limit:
        description: Max schools to synthesize (0 = all eligible). Keep small for cursor/auto.
        required: false
        default: "0"
      dry_run:
        description: Digest only (no capture)
        required: false
        type: boolean
        default: false
  schedule:
    # Thursdays 07:00 UTC — day after pack-quality loop
    - cron: "0 7 * * 4"

permissions:
  contents: write

concurrency:
  group: qualitative-loop
  cancel-in-progress: false

jobs:
  qualitative-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data enrichment deps
        run: pip install -r requirements-data.txt

      - name: Run qualitative loop
        env:
          # Schedule defaults: broad free coverage. Dispatch inputs can override.
          LIMIT: ${{ github.event.inputs.limit || '50' }}
          REFRESH_DAYS: ${{ github.event.inputs.refresh_stale_days || '28' }}
          REFRESH_LIMIT: ${{ github.event.inputs.refresh_limit || '15' }}
          SYNTH: ${{ github.event.inputs.synthesize_provider || 'none' }}
          SYNTH_LIMIT: ${{ github.event.inputs.synthesize_limit || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # skip-existing is the Python default — do not pass a rejected flag.
          ARGS=(
            --la Hampshire
            --limit "$LIMIT"
            --refresh-stale-days "$REFRESH_DAYS"
            --refresh-limit "$REFRESH_LIMIT"
            --synthesize-provider "$SYNTH"
          )
          if [ "$SYNTH_LIMIT" != "0" ]; then
            ARGS+=(--synthesize-limit "$SYNTH_LIMIT")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 scripts/run-qualitative-loop.py "${ARGS[@]}"

      - name: Commit qualitative data + digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output public/data/schools-index.json \
            public/data/packs/qualitative-loop-latest.json \
            public/data/packs/qualitative-loop-latest.md
          if git diff --staged --quiet; then
            echo "No qualitative loop changes"
          else
            if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
              MSG="Qualitative loop dry-run digest"
            else
              MSG="Qualitative loop: coverage capture and narratives"
            fi
            git commit -m "$MSG"
            git push
          fi
