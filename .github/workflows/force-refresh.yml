name: Force school data refresh

# Triggered by "A school is missing" (repository_dispatch) or manually.
# Hard-limited to one successful refresh per UTC day.

on:
  workflow_dispatch:
    inputs:
      school:
        description: "Missing school name or URN (optional)"
        required: false
        type: string
  repository_dispatch:
    types: [missing-school]

permissions:
  contents: write
  actions: read

concurrency:
  group: force-school-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce one force refresh per UTC day
        id: gate
        run: |
          set -euo pipefail
          STATE=public/data/force-refresh-state.json
          TODAY=$(date -u +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "$STATE" ]; then
            LAST=$(python3 -c "import json; print(json.load(open('$STATE')).get('lastForcedDate',''))")
            if [ "$LAST" = "$TODAY" ]; then
              echo "Already forced a refresh on $TODAY UTC — skipping."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: "3.12"

      - name: Harvest and enrich Hampshire maintained index
        if: steps.gate.outputs.allowed == 'true'
        run: |
          # Keep force-refresh on the seed-LA maintained path (incl. EY pack).
          # Out-of-area on-demand packs are a separate backlog item.
          python3 scripts/harvest-schools.py --seed-la
          python3 scripts/enrich-geocode.py
          python3 scripts/enrich-secondaries.py --seed-la
          python3 scripts/enrich-independents.py
          python3 scripts/enrich-phonics.py --seed-la
          python3 scripts/harvest-ey-providers.py
          python3 scripts/harvest-childminders.py
          python3 scripts/enrich-ey-schools.py
      - name: Extract KS2 history (soft-fail)
        if: steps.gate.outputs.allowed == 'true'
        continue-on-error: true
        run: python3 scripts/extract-ks2-history.py --seed-la

      - name: Record force-refresh stamp + interest signal
        if: steps.gate.outputs.allowed == 'true'
        env:
          TODAY: ${{ steps.gate.outputs.today }}
          SCHOOL: ${{ github.event.client_payload.school || inputs.school || '' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts")
          from pack_interest import append_interest_event, _resolve_school_query_to_la

          school = (os.environ.get("SCHOOL") or "").strip() or None
          path = Path("public/data/force-refresh-state.json")
          payload = {
            "lastForcedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "lastForcedDate": os.environ["TODAY"],
            "school": school,
            "triggeredBy": os.environ.get("GITHUB_ACTOR") or "workflow",
          }
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          event = {
            "kind": "missing-school",
            "school": school,
            "source": "force-refresh",
          }
          if school:
            la = _resolve_school_query_to_la(school)
            if la:
              event["localAuthority"] = la
          append_interest_event(event)
          print(payload)
          PY

      - name: Commit refreshed data
        if: steps.gate.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/schools-index.json public/data/schools-directory.json public/data/harvest-summary.json public/data/force-refresh-state.json public/data/packs/interest-log.jsonl src/data/harvest-summary.json public/data/ks2-history public/data/ey-providers-index.json public/data/childminders-index.json
          if git diff --staged --quiet; then
            # Still commit stamp if harvest produced no diff but stamp is new
            git add public/data/force-refresh-state.json public/data/packs/interest-log.jsonl
            if git diff --staged --quiet; then
              echo "No data changes"
            else
              git commit -m "Record force-refresh stamp"
              git push
            fi
          else
            git commit -m "Force refresh school index (missing-school request)"
            git push
          fi
