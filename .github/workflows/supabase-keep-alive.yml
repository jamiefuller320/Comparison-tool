name: Keep Supabase alive

# Free-tier projects pause after ~7 days with too little database activity.
# Ping PostgREST on a schedule so the optional accounts backend stays warm.
# Requires repo secrets NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY
# (same secrets used by Deploy GitHub Pages). Skips cleanly when unset.

on:
  schedule:
    # Every 3 days at 07:00 UTC — well inside the 7-day inactivity window.
    - cron: "0 7 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Supabase secrets not configured — skipping keep-alive."
            exit 0
          fi

          URL="${SUPABASE_URL%/}"
          # Lightweight SELECT against shortlists. RLS may return [] for anon;
          # the request still counts as database activity.
          code=$(curl -sS -o /tmp/supabase-keepalive.json -w "%{http_code}" \
            --connect-timeout 30 --max-time 60 \
            "${URL}/rest/v1/shortlists?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            -H "Prefer: count=exact") || {
            echo "curl failed — project may be paused or unreachable."
            exit 1
          }

          echo "HTTP ${code}"
          head -c 500 /tmp/supabase-keepalive.json || true
          echo

          case "${code}" in
            200|206)
              echo "Keep-alive OK — Supabase responded."
              ;;
            401|403)
              # Auth/RLS rejection still proves the API + DB are up.
              echo "Keep-alive reached Supabase (auth/RLS ${code})."
              ;;
            *)
              echo "Unexpected status ${code}."
              echo "If the project is paused, restore it in the Supabase dashboard, then re-run this workflow."
              exit 1
              ;;
          esac
